[project]
name = "private-ai-studio-backend"
version = "0.1.0"
description = "Private AI Studio application API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
